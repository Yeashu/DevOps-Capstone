alertmanager:
  enabled: false
prometheus-pushgateway:
  enabled: false
prometheus-node-exporter:
  enabled: false
kube-state-metrics:
  enabled: false
server:
  persistentVolume:
    enabled: false
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: '1'
      memory: 768Mi
  global:
    scrape_interval: 10s
    evaluation_interval: 10s
extraScrapeConfigs: |
  - job_name: orbit-api
    metrics_path: /metrics
    kubernetes_sd_configs:
      - role: endpoints
        namespaces:
          names: [orbit]
    relabel_configs:
      - source_labels: [__meta_kubernetes_service_label_app]
        action: keep
        regex: orbit
      - source_labels: [__meta_kubernetes_service_label_component]
        action: keep
        regex: backend
      - source_labels: [__meta_kubernetes_endpoint_port_name]
        action: keep
        regex: http
      - source_labels: [__meta_kubernetes_pod_name]
        target_label: pod
serverFiles:
  alerting_rules.yml:
    groups:
      - name: orbit
        rules:
          - alert: OrbitBackendUnavailable
            expr: up{job="orbit-api"} == 0
            for: 1m
            labels:
              severity: warning
            annotations:
              summary: An Orbit API replica is not responding to Prometheus.
