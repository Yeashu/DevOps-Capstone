name: orbit
services:
  postgres:
    image: postgres:17-alpine
    user: postgres
    environment:
      POSTGRES_USER: orbit
      POSTGRES_DB: orbit
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-orbit-local-demo-password}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U orbit -d orbit']
      interval: 5s
      timeout: 3s
      retries: 12
    restart: unless-stopped
  backend:
    build: ./backend
    image: orbit-backend:local
    environment:
      DATABASE_URL: postgresql+psycopg://orbit:${POSTGRES_PASSWORD:-orbit-local-demo-password}@postgres:5432/orbit
      APP_VERSION: ${APP_VERSION:-local}
    command: [sh, -c, 'alembic upgrade head && exec uvicorn app.main:app --host 0.0.0.0 --port 8000 --workers 1']
    ports:
      - '127.0.0.1:8000:8000'
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
  frontend:
    build: ./frontend
    image: orbit-frontend:local
    ports:
      - '127.0.0.1:3000:8080'
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped
volumes:
  postgres-data:
