{{- range $component := list "backend" "frontend" }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $.Release.Name }}-{{ $component }}
  labels:
    app: {{ $.Release.Name }}
    component: {{ $component }}
spec:
  type: ClusterIP
  selector:
    app: {{ $.Release.Name }}
    component: {{ $component }}
  ports:
    - name: http
      port: {{ ternary 8000 80 (eq $component "backend") }}
      targetPort: http
{{- end }}
