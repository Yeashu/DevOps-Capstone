apiVersion: batch/v1
kind: Job
metadata:
  name: {{ .Release.Name }}-migrate-{{ .Release.Revision }}
  labels:
    app: {{ .Release.Name }}
    component: migration
spec:
  ttlSecondsAfterFinished: 86400
  backoffLimit: 12
  template:
    metadata:
      labels:
        app: {{ .Release.Name }}
        component: migration
    spec:
      automountServiceAccountToken: false
      restartPolicy: OnFailure
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: '{{ .Values.backend.repository }}:{{ .Values.backend.tag }}'
          imagePullPolicy: {{ .Values.imagePullPolicy }}
          command: [alembic, upgrade, head]
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.database.existingSecret }}
                  key: DATABASE_URL
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: [ALL]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
